# Keybinds
bind  r  source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind  c  new-window      -c "#{pane_current_path}"

# Copy mode improvement
bind -T copy-mode M-w               send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode C-w               send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Options
set -g history-limit      50000
set -g mouse              on
set -g base-index         1
set -g renumber-windows   on
set -g escape-time        10
set -g focus-events       on
set -g set-clipboard      on
set -g display-time       2000
set -g status-left-length 100

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.2'

set -g @catppuccin_flavor 'mocha'

# Claude hooks share one state per window: the last hook wins.
set -g @claude_status '#{?#{==:#{@claude_state},working},#[fg=#{@thm_sky}#,bold] ⟳,#{?#{==:#{@claude_state},waiting},#[fg=#{@thm_yellow}#,bold] ⏸,#{?#{==:#{@claude_state},done},#[fg=#{@thm_green}#,bold] ✔,}}}#[fg=#{@thm_fg},nobold]'
set -g @catppuccin_window_text         ' #W#{E:@claude_status}'
set -g @catppuccin_window_current_text ' #W#{E:@claude_status}'

# Muted Mocha tints, with stronger amber for waiting.
set -g @catppuccin_window_text_color '#{?#{==:#{@claude_state},working},#3f4d5f,#{?#{==:#{@claude_state},waiting},#5d4a2d,#{?#{==:#{@claude_state},done},#3f474f,#{@thm_surface_0}}}}'
set -g @catppuccin_window_current_text_color '#{?#{==:#{@claude_state},working},#505f71,#{?#{==:#{@claude_state},waiting},#6c5939,#{?#{==:#{@claude_state},done},#515a63,#{@thm_surface_1}}}}'

set -g @continuum-restore       'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot          'on'

# Avoid creating an extra session after resurrect on startup.
# Also: Override `new-session -t` to `start-server` in tmux.service file.
set -g @continuum-systemd-start-cmd 'start-server'

set -g @resurrect-processes \
  '"~copilot->copilot --continue" "~claude->claude --continue"'

# Show whether prefix key has been pressed.
set -g status-right "#{?client_prefix, ⌨ PREFIX |,} %d-%m-%Y %H:%M "

run 'tpack init'
