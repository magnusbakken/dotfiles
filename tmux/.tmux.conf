# Keybinds
bind  r  source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind  c  new-window      -c "#{pane_current_path}"

# Copy mode improvement
bind -T copy-mode M-w               send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode C-w               send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Options
set -g history-limit    50000
set -g mouse            on
set -g base-index       1
set -g renumber-windows on
set -g escape-time      10
set -g focus-events     on
set -g set-clipboard    on
set -g display-time     2000

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @continuum-boot 'on'

# Avoid creating an extra session after resurrect on startup.
# Also: Override `new-session -t` to `start-server` in tmux.service file.
set -g @continuum-systemd-start-cmd 'start-server'

set -g @resurrect-processes \
  '"~copilot->copilot --continue" "~claude->claude --continue"'

# Claude state comes from hooks, not process detection or account data.
set -g @agent-indicator-processes ''
set -g @agent-indicator-icons 'claude=Claude,default=AI'
set -g @agent-indicator-animation-enabled 'off'
set -g @agent-indicator-background-enabled 'off'
set -g @agent-indicator-limits-enabled 'off'
set -g @agent-indicator-notification-enabled 'off'
set -g @agent-indicator-notification-command ''
# Badges own state colors; preserve readable window names on the green bar.
set -g @agent-indicator-needs-input-window-title-bg ''
set -g @agent-indicator-needs-input-window-title-fg ''
set -g @agent-indicator-done-window-title-bg ''
set -g @agent-indicator-done-window-title-fg ''

set -g status-right-length 100
set -g status-interval 5
set -g window-status-format '#I:#W#F#(bash "$HOME/.config/tmux/window-agent-status.sh" "#{window_id}")'
set -g status-right "#{agent_indicator} |#{?client_prefix, ⌨ PREFIX |,} %d-%m-%Y %H:%M "

run 'tpack init'
