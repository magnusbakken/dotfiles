# Keybinds
bind  r  source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind  c  new-window      -c "#{pane_current_path}"

# Copy mode improvement
bind -T copy-mode M-w               send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode C-w               send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Options
set -g history-limit    50000
set -g mouse            on
set -g base-index       1
set -g renumber-windows on
set -g escape-time      10
set -g focus-events     on
set -g set-clipboard    on
set -g display-time     2000

# TODO: Can be removed after upgrading to tmux 3.6.
set -ag update-environment "WAYLAND_DISPLAY"

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @continuum-boot 'on'

# Avoid creating an extra session after resurrect on startup.
# Also: Override `new-session -t` to `start-server` in tmux.service file.
set -g @continuum-systemd-start-cmd 'start-server'

set -g @resurrect-processes \
  '"~copilot->copilot --continue" "~claude->claude --continue"'

run 'tpack init'
